{% load static %}
{# Shared map assets — include once per map page (inside extra_css or extra_js). #}
{# Leaflet LOKAL vendordan yuklanadi — cdnjs/unpkg CDN'lari O'zbekistonda ko'pincha
   bloklanadi, shunda xarita "oq/bo'sh" bo'lib qolardi. Endi CDN'ga bog'liq emas. #}
<link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}"/>
<link rel="stylesheet" href="{% static 'vendor/leaflet/markercluster/MarkerCluster.css' %}"/>
<link rel="stylesheet" href="{% static 'vendor/leaflet/markercluster/MarkerCluster.Default.css' %}"/>
<script>
  window.SAMMAP = {
    center: [40.1156, 64.5036],
    routeUrl: "{% url 'places:route' %}",
    revGeoUrl: "{% url 'places:reverse_geocode' %}",
    geojsonUrl: "{% url 'places:geojson' %}"
  };
</script>
<script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
<script>
  // Default L.marker rasmlari yo'lini aniq belgilaymiz — Leaflet'ning avtomatik
  // aniqlashi hashed/manifest static bilan ishlamasligi mumkin (store_form,
  // checkout kabi default marker ishlatadigan sahifalar uchun shart).
  if (window.L && L.Icon && L.Icon.Default) {
    L.Icon.Default.mergeOptions({
      iconRetinaUrl: "{% static 'vendor/leaflet/images/marker-icon-2x.png' %}",
      iconUrl: "{% static 'vendor/leaflet/images/marker-icon.png' %}",
      shadowUrl: "{% static 'vendor/leaflet/images/marker-shadow.png' %}"
    });
  }
</script>
<script src="{% static 'vendor/leaflet/markercluster/leaflet.markercluster.js' %}"></script>
<script src="{% static 'js/samcity-map.js' %}"></script>
